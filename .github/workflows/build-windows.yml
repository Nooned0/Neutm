name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name Neutm --collect-all PyQt6 neutm.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Neutm-Windows
          path: dist/Neutm.exe
